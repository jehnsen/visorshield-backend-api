version: "3.9"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: visorshield-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://visorshield:visorshield@postgres:5432/visorshield
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visorshield-net
    restart: "no"

  visorshield-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: visorshield-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://visorshield:visorshield@postgres:5432/visorshield
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - visorshield-net

  postgres:
    # pgvector/pgvector:pg16 bundles the pgvector extension — required for policy_embeddings table
    image: pgvector/pgvector:pg16
    container_name: visorshield-postgres
    environment:
      POSTGRES_USER: visorshield
      POSTGRES_PASSWORD: visorshield
      POSTGRES_DB: visorshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visorshield -d visorshield"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - visorshield-net

  redis:
    image: redis:7-alpine
    container_name: visorshield-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - visorshield-net

volumes:
  postgres_data:
  redis_data:

networks:
  visorshield-net:
    driver: bridge
